name: Build patched binaries

on:
  push:
    tags:
      - "*-patched.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - run: sudo xcode-select --switch /Applications/Xcode_26.0.app
      - run: xcrun simctl list > /dev/null
      - run: xcodebuild -downloadPlatform iOS
      - uses: actions/checkout@v5
      - name: Build xcframeworks
        working-directory: ios/Capacitor
        run: |
          set -euo pipefail
          for SCHEME in Capacitor Cordova; do
            xcodebuild archive \
              -scheme "$SCHEME" \
              -workspace Capacitor.xcworkspace \
              -destination "generic/platform=iOS Simulator" \
              -configuration Debug \
              -archivePath "./Build/$SCHEME-iOS-Simulator" \
              SKIP_INSTALL=NO \
              BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
              DEBUG_INFORMATION_FORMAT=dwarf-with-dsym
            xcodebuild archive \
              -scheme "$SCHEME" \
              -workspace Capacitor.xcworkspace \
              -destination "generic/platform=iOS" \
              -archivePath "./Build/$SCHEME-iOS" \
              SKIP_INSTALL=NO \
              SWIFT_SERIALIZE_DEBUGGING_OPTIONS=NO \
              DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
              BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
              CODE_SIGNING_ALLOWED=NO
          done
          rm -rf ./Build/Capacitor-iOS-Simulator.xcarchive/Products/Library/Frameworks/Capacitor.framework/Frameworks
          rm -rf ./Build/Capacitor-iOS.xcarchive/Products/Library/Frameworks/Capacitor.framework/Frameworks
          for SCHEME in Capacitor Cordova; do
            xcodebuild -create-xcframework \
              -framework "./Build/$SCHEME-iOS-Simulator.xcarchive/Products/Library/Frameworks/$SCHEME.framework" \
              -debug-symbols "$PWD/Build/$SCHEME-iOS-Simulator.xcarchive/dSYMs/$SCHEME.framework.dSYM" \
              -framework "./Build/$SCHEME-iOS.xcarchive/Products/Library/Frameworks/$SCHEME.framework" \
              -debug-symbols "$PWD/Build/$SCHEME-iOS.xcarchive/dSYMs/$SCHEME.framework.dSYM" \
              -output "$SCHEME.xcframework"
            zip -r "$SCHEME.xcframework.zip" "$SCHEME.xcframework"
          done
      - name: Publish release
        working-directory: ios/Capacitor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "Built from $GITHUB_SHA."
            echo
            echo "Capacitor checksum: $(swift package compute-checksum Capacitor.xcframework.zip)"
            echo "Cordova checksum: $(swift package compute-checksum Cordova.xcframework.zip)"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            Capacitor.xcframework.zip Cordova.xcframework.zip \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest=false \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
